version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Exact-pinned on purpose: src/FilesChanged.tsx patches one of its private methods (README "Run"). Upgrade it by
      # hand and check that patch still applies.
      - dependency-name: "@pierre/diffs"
    groups:
      # Everything that ships to users' machines (the `dependencies`: the server's runtime).
      production:
        dependency-type: production
        update-types: [minor, patch]
      # Build and test tooling, and the frontend libraries bundled into dist/web at build time.
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Majors come as one PR each, so each gets read.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The docs site (a standalone package with its own lockfile; Cloudflare Pages builds it).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        update-types: [minor, patch]
