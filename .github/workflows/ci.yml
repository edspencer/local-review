name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's older run. Pushes to main get a group per commit, so they never cancel (or,
# as a pending run in a shared group would be, get superseded by) each other: release.yml's verify-ci job waits for
# the CI run on the exact commit it's releasing, and a cancelled run there would block the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Node 22 bundles npm 10 and the lockfile was written by npm 11; `npm ci` reads it fine with both.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Packs the package, installs the tarball into a temp prefix and runs it as a user would (scripts/smoke-pack.mjs).
      - name: Smoke-test the npm package
        run: npm run smoke:pack

  # `local-review service …` against the REAL service manager: launchd's gui/<uid> domain on the macOS runner,
  # systemd's user instance on the Ubuntu runner (lingering turned on so there is one). scripts/service-real.mjs packs
  # and installs the package, then installs, kills, restarts and uninstalls the service. It writes into the runner's
  # real LaunchAgents / systemd user directory, which is why it runs only here.
  service:
    name: Service (real ${{ matrix.os == 'macos-latest' && 'launchd' || 'systemd' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start a systemd user instance (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The service lifecycle, for real
        env:
          LOCAL_REVIEW_REAL_SERVICE: '1'
        run: node scripts/service-real.mjs

  website:
    name: Docs site build
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # Cloudflare Pages builds website/ on its own, so this catches a broken docs build before it merges. Only when
      # website/ changes; until website/ exists it never matches, and the job passes with its build steps skipped.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'website/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.docs == 'true'
        with:
          node-version: 22
      # `npm install`, not `npm ci`: it's what Cloudflare Pages runs.
      - name: Install docs-site deps
        if: steps.filter.outputs.docs == 'true'
        run: npm install
        working-directory: website
      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        run: npm run build
        working-directory: website
      # Every site-relative link (and #fragment) in the built pages resolves (no dependencies; scripts/check-links.mjs).
      - name: Check internal links
        if: steps.filter.outputs.docs == 'true'
        run: node scripts/check-links.mjs
        working-directory: website

  # One stable check name to require in branch rules, so the matrix can change without editing them.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, service, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job concluded '${r}'"
              exit 1
            fi
          done
