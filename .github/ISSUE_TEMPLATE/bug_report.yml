name: Bug report
description: Something in Local Review doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. For a security problem, please don't use this form: report it privately (see SECURITY.md).

        Screenshots and logs show paths, repo names and commit messages. Leave out anything you don't want public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran and what you clicked. A minimal `project.yaml` helps a lot if it's about how commits or stacks show up.
      placeholder: |
        1. `npx local-review init demo`, then edit project.yaml to …
        2. `npx local-review`
        3. Open … and click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Local Review version
      description: The output of `npx local-review --version` (or `local-review --version`).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (not officially supported)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1, Ubuntu 24.04, …"
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: If it's about the UI.
      placeholder: "Chrome 141, Safari 26, …"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Server output from the terminal, errors from the browser console, screenshots.
      render: text
