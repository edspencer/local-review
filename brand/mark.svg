<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Local Review</title>
  <!-- Local Review mark: a stack of PRs, the front one reviewed. Hand-authored; the source of every other asset in
       brand/ (see brand/README.md). Coordinates sit on a 2-unit grid so edges land on whole pixels at 16px. -->
  <rect id="tile" width="32" height="32" rx="6" fill="#4a1942"/>
  <!-- back to front: each card is cut out of the one behind it by a 2-unit plum gap -->
  <rect x="4" y="4" width="18" height="8" rx="2" fill="#a8749d"/>
  <rect x="5" y="7" width="22" height="12" rx="4" fill="#4a1942"/>
  <rect x="7" y="9" width="18" height="8" rx="2" fill="#ead6e5"/>
  <rect x="8" y="12" width="22" height="18" rx="4.5" fill="#4a1942"/>
  <rect x="10" y="14" width="18" height="14" rx="2.5" fill="#e8a33d"/>
  <path d="M14 21l3.5 3.5 6.5-7" fill="none" stroke="#2b0f27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
